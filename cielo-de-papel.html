<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cielo de Papel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A2347;
  --paper:#F7E9CF;
  --paper-edge:#CDB48A;
  --amber:#F2A541;
  --coral:#EF5D60;
  --teal:#3FB8AF;
  --plum:#5B3A73;
  --lilac:#C58BE0;
  --sky:#8FB8F2;
  --bg:#2a2350;
  --veil:rgba(26,20,52,.62);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1838;--veil:rgba(16,12,36,.7);}}
:root[data-theme="dark"]{--bg:#1c1838;--veil:rgba(16,12,36,.7);}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);overflow:hidden;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;max-width:640px;margin:0 auto;overflow:hidden;background:#2f2a66}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none;gap:8px}
.hud.hidden{display:none}
.score{font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:32px;line-height:1;letter-spacing:.5px;text-shadow:0 3px 0 rgba(20,12,40,.45)}
.sub-hud{font-size:13px;font-weight:800;opacity:.85;margin-top:4px;display:flex;gap:10px;align-items:center}
.sub-hud .st{color:var(--amber)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lives{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.heart{width:24px;height:22px;transition:transform .25s,opacity .25s}
.heart.lost{opacity:.22;transform:scale(.75)}
.wave-tag{font-weight:900;font-size:13px;background:var(--paper);color:var(--ink);padding:3px 9px;border-radius:4px;transform:rotate(2deg);box-shadow:0 3px 0 var(--paper-edge)}
.combo{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:'Lilita One',sans-serif;font-size:22px;color:var(--amber);text-shadow:0 3px 0 rgba(20,12,40,.5);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.combo.on{opacity:1}
.combo.pop{animation:pop .28s ease-out}
.combo .cbar{display:block;height:4px;margin:4px auto 0;width:100%;background:var(--amber);border-radius:2px;transform-origin:left center;box-shadow:0 2px 0 rgba(20,12,40,.4)}
.score{display:inline-block;transform-origin:left center}
.score.bump{animation:bump .16s ease-out}
.st{display:inline-block}
.st.bump{animation:bump .2s ease-out}
@keyframes bump{40%{transform:scale(1.16)}}
.heart.breaking{animation:heartBreak .55s ease-out}
@keyframes heartBreak{0%{transform:scale(1.6) rotate(-18deg);opacity:1}45%{transform:scale(.6) rotate(12deg)}100%{transform:scale(.75);opacity:.22}}
@keyframes pop{0%{transform:translateX(-50%) scale(1.5)}100%{transform:translateX(-50%) scale(1)}}

.ctrl{position:absolute;display:flex;gap:10px;pointer-events:auto}
.ctrl.hidden{display:none}
#pauseBtn{left:14px;bottom:16px}
#bombWrap{right:14px;bottom:16px}
#abilWrap{right:88px;bottom:16px}
.round{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--paper-edge),0 8px 14px rgba(10,6,30,.35);display:grid;place-items:center;position:relative;font-family:'Lilita One',sans-serif;font-size:18px;transition:transform .1s}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper-edge)}
.round.bomb{width:62px;height:62px;background:var(--coral);color:var(--paper);box-shadow:0 4px 0 #a83a3e,0 8px 14px rgba(10,6,30,.35)}
.round.bomb[disabled]{filter:grayscale(.8);opacity:.55;cursor:default}
.badge{position:absolute;top:-4px;right:-4px;background:var(--paper);color:var(--ink);border-radius:10px;font-size:13px;min-width:22px;height:22px;display:grid;place-items:center;font-family:'Nunito';font-weight:900;box-shadow:0 2px 0 var(--paper-edge)}
.round.abil{width:60px;height:60px;padding:0;background:conic-gradient(var(--teal) calc(var(--p,1)*1turn),rgba(20,12,40,.45) 0);box-shadow:0 4px 0 #2a807a,0 8px 14px rgba(10,6,30,.35)}
.round.abil .in{position:absolute;inset:5px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.round.abil .in svg{width:26px;height:26px}
.round.abil.ready{animation:readyPulse 1.2s ease-in-out infinite}
.round.abil.cool .in{background:#d8c8aa;color:#7a6a5a}
@keyframes readyPulse{50%{box-shadow:0 4px 0 #2a807a,0 0 0 7px rgba(63,184,175,.3),0 8px 14px rgba(10,6,30,.35)}}

/* ---------- Banner y avisos ---------- */
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
.banner h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(34px,9vw,52px);margin:0;color:var(--paper);text-shadow:0 4px 0 var(--plum),0 9px 0 rgba(10,6,30,.3)}
.banner p{margin:6px 0 0;font-weight:800;font-size:15px;opacity:.9}
.banner.show{animation:banner 2s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:scale(.6) rotate(-6deg)}15%{opacity:1;transform:scale(1.08) rotate(1deg)}25%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.toasts{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92%,340px);z-index:5}
.toast{display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:6px;box-shadow:0 4px 0 var(--paper-edge),0 10px 18px rgba(10,6,30,.35);font-weight:800;font-size:13.5px;width:100%;animation:toastIn 2.8s ease forwards}
.toast .tico{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;flex:none;font-family:'Lilita One',sans-serif;font-size:16px;color:var(--paper)}
.toast b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:15px;display:block}
@keyframes toastIn{0%{opacity:0;transform:translateY(-14px) rotate(-2deg)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* ---------- Pantallas ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--veil);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:8}
.screen.hidden{display:none}
.screen.clear{background:linear-gradient(to bottom,rgba(20,14,44,.15),rgba(20,14,44,.6))}
.title{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 0;margin:0 0 4px;max-width:440px}
.word{display:flex;gap:3px;margin:0 8px}
.tile{display:inline-grid;place-items:center;font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(32px,9.5vw,56px);line-height:1;width:1.05em;height:1.18em;background:var(--paper);color:var(--ink);border-radius:4px;box-shadow:0 5px 0 var(--paper-edge),0 12px 18px rgba(10,6,30,.35);transform:rotate(var(--r,0deg));animation:drop .7s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:var(--d,0s)}
.tile.c{background:var(--coral);color:var(--paper);box-shadow:0 5px 0 #a83a3e,0 12px 18px rgba(10,6,30,.35)}
.tile.a{background:var(--amber);color:var(--ink);box-shadow:0 5px 0 #b67722,0 12px 18px rgba(10,6,30,.35)}
.tile.t{background:var(--teal);color:var(--paper);box-shadow:0 5px 0 #2a807a,0 12px 18px rgba(10,6,30,.35)}
@keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(calc(var(--r,0deg)*6))}100%{opacity:1}}
.sub{font-weight:800;font-size:15px;max-width:30ch;margin:12px 0 16px;line-height:1.45;opacity:.95}
.btn{font-family:'Lilita One',sans-serif;font-size:24px;letter-spacing:.3px;border:none;cursor:pointer;padding:14px 38px;border-radius:6px;background:var(--amber);color:var(--ink);box-shadow:0 5px 0 #b67722,0 12px 20px rgba(10,6,30,.35);transform:rotate(-1.5deg);transition:transform .1s}
.btn:hover{transform:rotate(-1.5deg) translateY(-2px)}
.btn:active{transform:rotate(-1.5deg) translateY(4px);box-shadow:0 1px 0 #b67722}
.btn.ghost{background:var(--paper);box-shadow:0 5px 0 var(--paper-edge),0 12px 20px rgba(10,6,30,.35);font-size:19px;padding:11px 28px;transform:rotate(1deg)}
.btn.ghost:active{box-shadow:0 1px 0 var(--paper-edge)}
.btn.teal{background:var(--teal);color:var(--paper);box-shadow:0 5px 0 #2a807a,0 12px 20px rgba(10,6,30,.35);font-size:19px;padding:11px 24px}
.btn.small{font-size:16px;padding:8px 14px;transform:none;box-shadow:0 3px 0 #b67722}
.btn.small.ghost{box-shadow:0 3px 0 var(--paper-edge)}
.btn[disabled]{filter:grayscale(.7);opacity:.6;cursor:default}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px}
.purse{position:absolute;top:14px;left:14px;background:var(--paper);color:var(--ink);font-family:'Lilita One',sans-serif;font-size:18px;padding:6px 12px;border-radius:5px;box-shadow:0 3px 0 var(--paper-edge);transform:rotate(-2deg)}
.purse span{color:#c47a12}
.icon-btn{position:absolute;top:14px;right:14px;background:var(--paper);color:var(--ink);border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 var(--paper-edge)}
.cp-label{font-weight:800;font-size:13px;opacity:.85;margin:16px 0 6px}
.cps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:340px}
.chip{border:none;cursor:pointer;font-family:'Lilita One',sans-serif;font-size:15px;padding:6px 12px;border-radius:5px;background:rgba(247,233,207,.18);color:var(--paper);box-shadow:inset 0 0 0 2px rgba(247,233,207,.35)}
.chip.on{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--paper-edge)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;width:min(360px,100%)}
.navb{border:none;cursor:pointer;background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:12.5px;box-shadow:0 4px 0 var(--paper-edge),0 8px 14px rgba(10,6,30,.3);position:relative}
.navb:nth-child(odd){transform:rotate(-1.5deg)}.navb:nth-child(even){transform:rotate(1.5deg)}
.navb svg{width:26px;height:26px}
.navb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper-edge)}
.dotnew{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--paper)}

.card{background:var(--paper);color:var(--ink);padding:24px 26px 26px;border-radius:8px;box-shadow:0 7px 0 var(--paper-edge),0 20px 40px rgba(10,6,30,.45);transform:rotate(-1deg);min-width:260px;max-width:360px;width:100%;animation:cardIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardIn{0%{transform:translateY(40px) rotate(-6deg);opacity:0}100%{transform:rotate(-1deg);opacity:1}}
.card h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:34px;margin:0 0 4px;color:var(--coral)}
.card .big{font-family:'Lilita One',sans-serif;font-size:52px;line-height:1.05;margin:4px 0}
.meta{font-weight:800;font-size:14px;opacity:.75}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 14px;font-weight:800;font-size:13px}
.stats div{background:rgba(42,35,71,.07);border-radius:6px;padding:7px}
.stats b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:21px;color:var(--plum)}
.record{display:inline-block;background:var(--amber);color:var(--ink);font-weight:900;font-size:13px;padding:4px 10px;border-radius:4px;transform:rotate(3deg);margin-bottom:6px;animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{50%{transform:rotate(-3deg) scale(1.06)}}
.earned{font-family:'Lilita One',sans-serif;font-size:20px;color:#c47a12;margin:0 0 6px}
.mdone{font-size:13px;font-weight:800;text-align:left;margin:0 0 12px}
.mdone div{padding:4px 0;border-bottom:1px dashed rgba(42,35,71,.2)}

/* ---------- Hojas (misiones, hangar, récords, ajustes) ---------- */
.sheet{background:var(--paper);color:var(--ink);border-radius:10px;width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 7px 0 var(--paper-edge),0 20px 40px rgba(10,6,30,.45);text-align:left;animation:cardIn .45s cubic-bezier(.2,1.3,.4,1);transform:rotate(-.5deg)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;gap:10px}
.sheet-h h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;margin:0;color:var(--plum)}
.sheet-h .purse2{font-family:'Lilita One',sans-serif;font-size:17px;color:#c47a12;margin-left:auto}
.close{border:none;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:6px;padding:0 18px 10px}
.tab{border:none;cursor:pointer;font-weight:900;font-size:13.5px;padding:7px 12px;border-radius:5px;background:rgba(42,35,71,.08);color:var(--ink)}
.tab.on{background:var(--ink);color:var(--paper)}
.sheet-b{overflow-y:auto;padding:4px 18px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.mission{background:#fff7e6;border-radius:7px;padding:11px 12px;margin-bottom:9px;box-shadow:0 3px 0 #e2cfa8;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.mission .mt{font-weight:900;font-size:14.5px}
.mission .rw{font-family:'Lilita One',sans-serif;color:#c47a12;font-size:16px}
.bar{grid-column:1/-1;height:9px;border-radius:5px;background:rgba(42,35,71,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.mission .pg{grid-column:1/-1;font-size:12px;font-weight:800;opacity:.7}
.hint{font-size:13px;font-weight:700;opacity:.75;margin:4px 0 12px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{background:#fff7e6;border-radius:8px;padding:8px 8px 10px;box-shadow:0 3px 0 #e2cfa8;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.skin canvas{width:96px;height:72px}
.skin .nm{font-weight:900;font-size:13.5px}
.skin.eq{box-shadow:0 0 0 3px var(--teal),0 3px 0 #e2cfa8}
.skin .req{font-size:11.5px;font-weight:800;opacity:.7;text-align:center;line-height:1.25;min-height:28px}
.row{background:#fff7e6;border-radius:8px;padding:11px 12px;margin-bottom:9px;box-shadow:0 3px 0 #e2cfa8;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.row.eq{box-shadow:0 0 0 3px var(--teal),0 3px 0 #e2cfa8}
.row .ic{width:40px;height:40px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.row .ic svg{width:24px;height:24px}
.row .nm{font-weight:900;font-size:14.5px}
.row .ds{font-size:12.5px;font-weight:700;opacity:.75;line-height:1.35}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:rgba(42,35,71,.15)}
.pips i.on{background:var(--teal)}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.recs div{background:#fff7e6;border-radius:7px;padding:9px 10px;box-shadow:0 3px 0 #e2cfa8;font-weight:800;font-size:12.5px}
.recs b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:22px;color:var(--plum)}
.top{list-style:none;margin:0;padding:0}
.top li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px dashed rgba(42,35,71,.2);font-weight:800;font-size:13.5px}
.top li .pos{font-family:'Lilita One',sans-serif;font-size:18px;color:var(--coral)}
.top li .sc{font-family:'Lilita One',sans-serif;font-size:18px}
.top li small{display:block;font-size:11.5px;opacity:.65}
.sec{font-family:'Lilita One',sans-serif;font-size:18px;margin:6px 0 8px;color:var(--plum)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px dashed rgba(42,35,71,.2);font-weight:900;font-size:14.5px}
.sw{width:50px;height:28px;border-radius:14px;border:none;cursor:pointer;background:rgba(42,35,71,.2);position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--teal)}
.sw.on::after{transform:translateX(22px)}
.danger{margin-top:18px;width:100%;border:none;cursor:pointer;background:transparent;color:#b0303a;font-weight:900;font-size:14px;padding:10px;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(176,48,58,.4)}
.danger.armed{background:#b0303a;color:#fff}
.code{display:block;width:100%;min-height:74px;margin:8px 0;padding:8px 10px;border-radius:6px;border:2px dashed rgba(42,35,71,.3);background:#fff7e6;color:var(--ink);font:600 11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:vertical;user-select:text;-webkit-user-select:text;touch-action:auto}
.code:focus{outline:3px solid var(--amber);outline-offset:1px}
.cloud{display:flex;gap:10px;align-items:center;background:#fff7e6;border-radius:8px;padding:10px 12px;box-shadow:0 3px 0 #e2cfa8;font-weight:800;font-size:13.5px;line-height:1.35;margin-bottom:10px}
.cloud .cico{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(42,35,71,.1)}
.cloud.ok .cico{background:var(--teal);color:#fff}
.cloud.err .cico{background:var(--coral);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.imsg{font-size:12.5px;font-weight:800;min-height:16px;margin:4px 0 0}
.imsg.bad{color:#b0303a}.imsg.warn{color:#9a5a10}
.empty{font-weight:800;font-size:13.5px;opacity:.7;padding:10px 0}

@media (prefers-reduced-motion: reduce){
  .tile,.card,.record,.sheet,.toast{animation:none}
  .round.abil.ready{animation:none}
  .banner.show{animation:bannerSoft 2s linear forwards}
  @keyframes bannerSoft{0%,85%{opacity:1}100%{opacity:0}}
}
@media (max-height:640px){ .tile{font-size:30px} .sub{display:none} .nav{margin-top:12px} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Juego Cielo de Papel"></canvas>

  <div class="hud hidden" id="hud">
    <div>
      <div class="score" id="score">0</div>
      <div class="sub-hud"><span id="bestHud">Récord 0</span><span class="st" id="starHud">★ 0</span></div>
    </div>
    <div class="right">
      <div class="lives" id="lives"></div>
      <div class="wave-tag" id="waveTag">Oleada 1</div>
    </div>
  </div>
  <div class="combo" id="combo"><span id="comboTxt">x1.0</span><span class="cbar" id="comboBar"></span></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="banner" id="banner"><h2 id="bannerTitle">Oleada 1</h2><p id="bannerSub"></p></div>

  <div class="ctrl hidden" id="pauseBtn">
    <button class="round" id="pauseBtnEl" aria-label="Pausa">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="ctrl hidden" id="abilWrap">
    <button class="round abil" id="abilBtn" aria-label="Usar habilidad"><span class="in" id="abilIcon"></span></button>
  </div>
  <div class="ctrl hidden" id="bombWrap">
    <button class="round bomb" id="bombBtn" aria-label="Lanzar bomba de confeti">

}

/* ================== MISIONES ================== */
function missionTier() { return Math.min(3, Math.floor(SV.missions.done / 4)); }
function newMission() {
  const active = SV.missions.active.map(m => m.id);
  const pool = MDEFS.filter(d => !active.includes(d.id));
  const d = pick(pool), tier = missionTier();
  return { id: d.id, tier, target: d.t[tier], base: d.kind === 'total' ? SV.totals[d.key] : 0, prog: 0, reward: REWARD[tier] };
}
function ensureMissions() {
  SV.missions.active = SV.missions.active.filter(m => MDEFS.some(d => d.id === m.id));
  while (SV.missions.active.length < 3) SV.missions.active.push(newMission());
}
function mProgress(m) {
  const d = MDEFS.find(x => x.id === m.id);
  return d.kind === 'total' ? SV.totals[d.key] - m.base : m.prog;
}
function runValue(key) {
  if (!run) return 0;
  return { wave: run.wave, score, combo: maxCombo, runStars: run.stars, clean: run.cleanBest }[key] || 0;
}
function checkMissions() {
  let changed = false;
  for (let i = 0; i < SV.missions.active.length; i++) {
    const m = SV.missions.active[i], d = MDEFS.find(x => x.id === m.id);
    if (d.kind === 'run' && state !== 'menu') m.prog = Math.max(m.prog, runValue(d.key));
    if (mProgress(m) >= m.target) {
      SV.stars += m.reward; SV.totals.starsEarned += m.reward; SV.missions.done++; SV.totals.missions++;
      if (run) { run.missions.push(d.txt(m.target)); run.earned += m.reward; }
      toast('Misión completada', d.txt(m.target) + '  +' + m.reward + ' ★', '#F2A541', '✓');
      sfx('mission'); buzz(40);
      SV.missions.active.splice(i, 1, null);
      changed = true;
    }
  }
  if (changed) {
    SV.missions.active = SV.missions.active.filter(Boolean);
    ensureMissions();
    checkUnlocks();
    save(); updatePurse();

}
function missionHTML(m) {
  const d = MDEFS.find(x => x.id === m.id);

}
function skinUnlocked(s) {
  if (SV.owned.includes(s.id)) return true;
  if (s.req) {
    const v = s.req.key === 'bestWave' ? SV.bestWave : SV.totals[s.req.key] || 0;
    return v >= s.req.n;
  }
  return false;
}
function checkUnlocks() {
  for (const s of SKINS) {

      SV.owned.push(s.id);

/* ================== ENEMIGOS ================== */

  else if (type === 'balloon') { e.hp = 6 + w; e.r = 26 * S; e.vy = (42 + w * 1.5) * S; e.score = 300; e.shootT = rand(0.8, 1.6); e.drop = 4; }
  else if (type === 'mine') { e.hp = 4 + Math.floor(w / 3); e.r = 18 * S; e.vy = (50 + w * 2) * S; e.score = 220; e.drop = 3; e.pts = Array.from({ length: 11 }, () => rand(0.82, 1.1)); }
  else if (type === 'bat') { e.hp = 2 + Math.floor(w / 5); e.r = 16 * S; e.vy = (85 + w * 3) * S; e.score = 180; e.drop = 2; e.turnT = rand(0.4, 1); }

}
function spawnBoss(kind) {

  boss = { type: 'boss', kind, x: W / 2, y: -90 * S, t: 0, hit: 0, dead: false, r: (kind === 'dragon' ? 46 : 50) * S, hp, maxHp: hp, score: 5000 * n, atkT: 2, pattern: 0, burst: 0, burstT: 0, spiral: 0, spiralA: 0, phase: 0, entering: true, drop: 16,

}
function eShoot(x, y, ang, spd, r) { ebullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: (r || 6) * S, t: 0 }); }
function updateEnemy(e, dt) {
  e.t += dt; if (e.hit > 0) e.hit -= dt;

  if (e.type === 'crane') {
    e.y += e.vy * dt; e.x = e.bx + Math.sin(e.t * 2.2 + e.phase) * e.amp;
    if (combat && wave >= 4) { e.shootT -= dt; if (e.shootT <= 0) { e.shootT = rand(2.5, 4.5); eShoot(e.x, e.y + 10, Math.atan2(player.y - e.y, player.x - e.x), (150 + wave * 5) * S); } }
  } else if (e.type === 'kite') {
    if (!e.dived) {
      e.y += e.vy * 0.6 * dt; e.x += Math.sin(e.t * 3 + e.phase) * 40 * S * dt;
      if (e.y > e.diveAt && combat) {
        e.dived = true;
        const a = Math.atan2(player.y - e.y, player.x - e.x), sp = (260 + wave * 10) * S;
        e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp;

      if (e.shootT <= 0 && e.y > 0) {
        e.shootT = Math.max(1.1, 2.5 - wave * 0.07);
        const a = Math.atan2(player.y - e.y, player.x - e.x), sp = (165 + wave * 6) * S;
        eShoot(e.x, e.y + e.r, a, sp);
        if (wave >= 6) { eShoot(e.x, e.y + e.r, a - 0.25, sp); eShoot(e.x, e.y + e.r, a + 0.25, sp); }
      }
    }
  } else if (e.type === 'mine') {
    e.y += e.vy * dt; e.x += Math.sin(e.t * 1.4 + e.phase) * 18 * S * dt;

function bossEnter(b, dt, targetY) {

function updateDragon(b, dt) {

function updateGarza(b, dt) {

/* ================== PARTÍCULAS ================== */
const CONFETTI = ['#F7E9CF', '#EF5D60', '#F2A541', '#3FB8AF', '#C58BE0'];
function mkPart(x, y, color, kind) {
  const a = rand(0, TAU), sp = kind === 'spark' ? rand(60, 220) : rand(80, 320);
  const p = { x, y, vx: Math.cos(a) * sp * S, vy: Math.sin(a) * sp * S - (kind === 'confetti' ? 60 * S : 0), life: kind === 'spark' ? rand(0.25, 0.5) : rand(0.7, 1.4), size: (kind === 'spark' ? rand(2, 4) : rand(4, 9)) * S, rot: rand(0, TAU), vr: rand(-10, 10), color, kind };
  p.max = p.life;

}
function explode(x, y, colors, count, big) {
  for (let i = 0; i < count; i++) { const p = mkPart(x, y, colors[i % colors.length], 'confetti'); if (big) { p.vx *= 1.6; p.vy *= 1.6; p.size *= 1.4; } parts.push(p); }
  for (let i = 0; i < count / 2; i++) parts.push(mkPart(x, y, '#fff6e0', 'spark'));
  parts.push({ x, y, kind: 'ring', life: 0.4, max: 0.4, size: (big ? 120 : 40) * S, color: '#fff6e0' });
}
function shards(x, y, cols, n, power) {
  for (let i = 0; i < n; i++) {

    ensureMissions();
    body.innerHTML = `<p class="hint">Completa misiones para ganar estrellas. Cada vez que terminas una, aparece otra nueva, y cada cuatro completadas suben de nivel. Llevas ${SV.missions.done} completadas.</p>` + SV.missions.active.map(missionHTML).join('');
  } else if (sheet.kind === 'hangar' && sheet.tab === 'skins') {
    body.innerHTML = `<div class="grid2">${SKINS.map(s => {
      const own = SV.owned.includes(s.id), eq = SV.skin === s.id, unl = skinUnlocked(s);
      let btn;
      if (eq) btn = `<button class="btn small ghost" disabled>Equipado</button>`;
      else if (own || unl) btn = `<button class="btn small" data-equip="${s.id}">Equipar</button>`;
      else if (s.req) btn = `<button class="btn small ghost" disabled>Bloqueado</button>`;
      else btn = `<button class="btn small" data-buy="${s.id}" ${SV.stars < s.cost ? 'disabled' : ''}>★ ${s.cost}</button>`;
      return `<div class="skin${eq ? ' eq' : ''}"><canvas data-prev="${s.id}" width="96" height="72" aria-hidden="true"></canvas><div class="nm">${s.name}</div><div class="req">${s.req && !own && !unl ? s.req.txt : own || unl ? 'Tuyo' : 'En venta'}</div>${btn}</div>`;
    }).join('')}</div>`;
    body.querySelectorAll('canvas[data-prev]').forEach(c => previewPlane(c, SKINS.find(s => s.id === c.dataset.prev)));
  } else if (sheet.kind === 'hangar' && sheet.tab === 'abil') {
    body.innerHTML = `<p class="hint">Lleva una habilidad equipada. Úsala con el botón turquesa o con la tecla E.</p>` + Object.entries(ABIL).map(([id, a]) => {
      const own = SV.abilities.includes(id), eq = SV.ability === id;
      const cd = Math.round(a.cd * (1 - 0.12 * SV.up.recarga) * 10) / 10;
      let btn = eq ? `<button class="btn small ghost" disabled>Equipada</button>` : own ? `<button class="btn small" data-eqab="${id}">Equipar</button>` : `<button class="btn small" data-buyab="${id}" ${SV.stars < a.cost ? 'disabled' : ''}>★ ${a.cost}</button>`;
      return `<div class="row${eq ? ' eq' : ''}"><div class="ic">${AICON[id]}</div><div><div class="nm">${a.name}</div><div class="ds">${a.desc} Recarga en ${String(cd).replace('.', ',')} s.</div></div>${btn}</div>`;
    }).join('');
  } else if (sheet.kind === 'hangar' && sheet.tab === 'up') {
    body.innerHTML = `<p class="hint">Mejoras permanentes para todas tus partidas.</p>` + Object.entries(UPS).map(([id, u]) => {
      const l = SV.up[id], maxed = l >= u.max;
      const pips = Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('');
      const btn = maxed ? `<button class="btn small ghost" disabled>Al máximo</button>` : `<button class="btn small" data-up="${id}" ${SV.stars < u.cost[l] ? 'disabled' : ''}>★ ${u.cost[l]}</button>`;
      return `<div class="row"><div class="ic" style="font-family:'Lilita One';font-size:20px">${u.ic}</div><div><div class="nm">${u.name}</div><div class="ds">${l ? u.desc(l) : 'Sin mejorar.'}${maxed ? '' : ' Siguiente: ' + u.desc(l + 1).toLowerCase()}</div><div class="pips">${pips}</div></div>${btn}</div>`;
    }).join('');
  } else if (sheet.kind === 'records' && sheet.tab === 'stats') {
    const t = SV.totals;
    const cells = [['Mejor puntuación', nf(SV.best)], ['Oleada más alta', SV.bestWave], ['Mejor combo', SV.bestCombo], ['Partidas', nf(t.games)], ['Enemigos derribados', nf(t.kills)], ['Jefes derrotados', nf(t.bosses)], ['Estrellas recogidas', nf(t.stars)], ['Misiones completadas', nf(t.missions)], ['Grullas', nf(t.cranes)], ['Cometas', nf(t.kites)], ['Globos', nf(t.balloons)], ['Minas', nf(t.mines)], ['Murciélagos', nf(t.bats)], ['Bombas lanzadas', nf(t.bombs)], ['Habilidad usada', nf(t.ability) + ' veces'], ['Punto de control', 'Oleada ' + SV.checkpoint]];
    body.innerHTML = `<div class="recs">${cells.map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('')}</div>`;
  } else if (sheet.kind === 'records' && sheet.tab === 'top') {
    body.innerHTML = SV.top.length ? `<ol class="top">${SV.top.map((r, i) => {
      const dt = new Date(r.d), sk = SKINS.find(s => s.id === r.k);
      return `<li><span class="pos">${i + 1}</span><span>Oleada ${r.w}<small>${dt.toLocaleDateString('es', { day: 'numeric', month: 'short' })}${sk ? ', con ' + sk.name : ''}</small></span><span class="sc">${nf(r.s)}</span></li>`;
    }).join('')}</ol>` : `<p class="empty">Aún no hay vuelos registrados. Despega y tu mejor partida aparecerá aquí.</p>`;
  } else if (sheet.kind === 'settings') {
    const tg = (id, label) => `<div class="toggle"><span>${label}</span><button class="sw${SV.settings[id] ? ' on' : ''}" data-set="${id}" role="switch" aria-checked="${SV.settings[id]}" aria-label="${label}"></button></div>`;
    body.innerHTML = tg('sound', 'Sonido') + tg('music', 'Música') + tg('shake', 'Temblor de pantalla') + tg('vibra', 'Vibración en el móvil') +
      `<p class="hint" style="margin-top:14px">Controles: arrastra para volar, botón rojo para la bomba y botón turquesa para la habilidad. En teclado: flechas o WASD, espacio, E y P.</p>` +
      `<div class="sec" style="margin-top:18px">Guardar partida</div>` +
      `<div class="cloud" id="cloudBox"><span class="cico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 19a5 5 0 0 1-.6-10A6.5 6.5 0 0 1 19 9.6 4.7 4.7 0 0 1 18.3 19z"/></svg></span><span id="cloudTxt"></span></div>` +
      `<p class="hint">El código de guardado es una copia de todo tu progreso en forma de texto. Guárdalo en tus notas y pégalo aquí en otro dispositivo o navegador para recuperarlo.</p>` +
      `<div class="btnrow"><button class="btn small" data-act="export">Copiar mi código</button></div>` +
      (exportStr ? `<textarea class="code" id="exportBox" readonly aria-label="Tu código de guardado">${exportStr}</textarea>` : '') +
      `<textarea class="code" id="importBox" placeholder="Pega aquí un código de guardado" aria-label="Código de guardado para cargar">${importDraft.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea>` +
      `<div class="btnrow"><button class="btn small ghost" data-act="import">${importArmed ? 'Sí, reemplazar mi progreso' : 'Cargar este código'}</button></div>` +
      `<p class="imsg ${importCls}" id="importMsg">${importMsg}</p>` +
      `<button class="danger" id="resetBtn">Borrar todo el progreso</button>`;
    refreshCloudUI();
  }
}
$('sheetBody').addEventListener('input', e => { if (e.target.id === 'importBox') { importDraft = e.target.value; if (importArmed) { importArmed = false; importMsg = ''; const b = document.querySelector('[data-act="import"]'); if (b) b.textContent = 'Cargar este código'; const m = document.getElementById('importMsg'); if (m) m.textContent = ''; } } });
$('sheetTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; sheet.tab = b.dataset.tab; sfx('click'); renderSheet(); });
let resetArmed = false;
$('sheetBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.buy) { const s = SKINS.find(x => x.id === d.buy); if (SV.stars >= s.cost) { SV.stars -= s.cost; SV.owned.push(s.id); SV.skin = s.id; sfx('buy'); toast('Avión comprado', s.name + ' ya está equipado', '#F2A541', '✈'); save(); } else sfx('nope'); }
  else if (d.equip) { SV.skin = d.equip; if (!SV.owned.includes(d.equip)) SV.owned.push(d.equip); sfx('click'); save(); }
  else if (d.buyab) { const a = ABIL[d.buyab]; if (SV.stars >= a.cost) { SV.stars -= a.cost; SV.abilities.push(d.buyab); SV.ability = d.buyab; sfx('buy'); toast('Habilidad comprada', a.name + ' ya está equipada', '#3FB8AF', '✦'); save(); } else sfx('nope'); }
  else if (d.eqab) { SV.ability = d.eqab; sfx('click'); save(); }
  else if (d.up) { const u = UPS[d.up], l = SV.up[d.up]; if (l < u.max && SV.stars >= u.cost[l]) { SV.stars -= u.cost[l]; SV.up[d.up]++; sfx('buy'); save(); } else sfx('nope'); }
  else if (d.set) { SV.settings[d.set] = !SV.settings[d.set]; if (d.set === 'sound') { unlockAudio(); renderMute(); } if (d.set === 'vibra' && SV.settings.vibra) buzz(30); sfx('click'); save(); }
  else if (d.act === 'export') {
    exportStr = makeCode();
    sfx('click');
    const done = ok => { toast(ok ? 'Código copiado' : 'Código listo', ok ? 'Pégalo en tus notas para guardarlo' : 'Mantén pulsado el texto para copiarlo', '#3FB8AF', '⧉'); };
    try { navigator.clipboard.writeText(exportStr).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    renderSheet();
    const box = document.getElementById('exportBox'); if (box) { box.focus(); box.select(); }
    return;
  }
  else if (d.act === 'import') {
    const box = document.getElementById('importBox'); if (box) importDraft = box.value;
    const data = readCode(importDraft);
    if (!data) { importArmed = false; importMsg = 'Ese código no es válido. Comprueba que lo has pegado completo.'; importCls = 'bad'; sfx('nope'); }
    else if (!importArmed) { importArmed = true; importMsg = 'Esto reemplazará tu progreso actual. Toca otra vez para confirmar.'; importCls = 'warn'; sfx('click'); }
    else {
      importArmed = false; importDraft = ''; importMsg = 'Progreso cargado.'; importCls = '';
      applySave(data); save();
      sfx('buy'); toast('Progreso cargado', '★ ' + nf(SV.stars) + ' y récord de ' + nf(SV.best), '#3FB8AF', '✓');
    }
  }
  else if (t.id === 'resetBtn') {
    if (!resetArmed) { resetArmed = true; t.classList.add('armed'); t.textContent = 'Toca otra vez para borrarlo todo'; setTimeout(() => { resetArmed = false; if (t.isConnected) { t.classList.remove('armed'); t.textContent = 'Borrar todo el progreso'; } }, 3000); return; }
    resetArmed = false;
    const snd = SV.settings.sound;
    SV = defaults(); SV.settings.sound = snd; ensureMissions(); save();
    toast('Progreso borrado', 'Empiezas de cero', '#EF5D60', '↺');
  }
  renderSheet();
});
function previewPlane(canvas, skin) {
  const c = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = 96 * dpr; canvas.height = 72 * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, 72); g.addColorStop(0, '#3b2f6e'); g.addColorStop(1, '#e8907a');
  c.fillStyle = g; c.fillRect(0, 0, 96, 72);
  const sc = ctx, ss = S;
  ctx = c; S = 1.25;
  try { drawPlane(48, 38, 0.15, false, skin); } finally { ctx = sc; S = ss; }
}
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { sfx('click'); openSheet(b.dataset.open); }));
$('sheetClose').onclick = closeSheet;

/* ================== BOTONES ================== */
$('playBtn').onclick = startGame;
$('againBtn').onclick = () => { finalize(); startGame(); };
$('menuBtn').onclick = toMenu;
$('quitBtn').onclick = () => { if (state === 'pause') { state = 'over'; pendingFinal = true; SV.bestWave = Math.max(SV.bestWave, wave); if (score > SV.best) SV.best = score; } toMenu(); };
$('resumeBtn').onclick = resumeGame;
$('reviveBtn').onclick = revive;
$('pauseBtnEl').onclick = pauseGame;
$('bombBtn').onclick = () => { unlockAudio(); useBomb(); };
$('abilBtn').onclick = () => { unlockAudio(); useAbility(); };
$('muteBtn').onclick = toggleMute;
$('muteBtn2').onclick = toggleMute;

/* ================== BUCLE ================== */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (state !== 'pause' && state !== 'over') update(dt);
  else if (state === 'over') { time += dt; updateScenery(dt); for (const p of parts) p.life -= dt; parts = parts.filter(p => p.life > 0); }
  render();
  requestAnimationFrame(loop);
}

ensureMissions();
checkUnlocks();
store.set(SAVE_KEY, SV);
resize();
renderMute(); updateBestLabels(); renderMenu();
setScreen('menu');
requestAnimationFrame(t => { last = t; loop(t); });
initCloud();
})();
</script>
</body>
